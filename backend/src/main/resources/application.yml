server:
  # 8080 容易被占用，固定用 62633
  port: 62633
  servlet:
    # 通用网关前缀：所有接口自动带上，Controller 里不用重复写 /api
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mf-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息全部走环境变量，见 backend/.env.local.example
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:mf_backend}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # 下划线转驼峰：device_name -> deviceName
    map-underscore-to-camel-case: true
    # 本地调试打开 SQL 日志，上线请改成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除统一用 deleted 字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mf.backend.entity

# 跨域白名单，多个用英文逗号分隔；* 表示全部放开（仅本地调试用）
cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

logging:
  level:
    root: info
    com.mf.backend: debug
